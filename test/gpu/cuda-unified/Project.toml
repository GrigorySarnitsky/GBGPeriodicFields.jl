[deps]
CUDA = "052768ef-5323-5732-b1bb-66c8b64840ba"
CUDA_Compiler_jll = "d1e2174e-dfdc-576e-b43e-73b79eb1aca8"
GBGPeriodicFields = "f1da9c2b-0ac1-4736-96f9-af1c25aedab1"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

# CUDACore is listed ONLY so that `LocalPreferences.toml` beside this file can name it. Since CUDA.jl 6
# the `default_memory` preference is read inside the `CUDACore` subpackage, and Preferences.jl maps a
# section name to a package only through a project's [deps], [weakdeps] or [extras]; CUDACore is
# otherwise a manifest-only dependency, and without this entry the preference is silently ignored.
[extras]
CUDACore = "bd0ed864-bdfe-4181-a5ed-ce625a5fdea2"

[sources]
GBGPeriodicFields = {path = "../../.."}

[compat]
# Same bounds as test/gpu/cuda, for the same reasons; see the comment there.
CUDA_Compiler_jll = "=0.5.1"
CUDA = "6.2"
