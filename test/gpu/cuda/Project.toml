# it in, so `using CUDA` dies at __init__ with "cannot open shared object file" even though the
# library is present in the depot. 0.5.1 is the last working release; lift this once upstream
# ships a fixed one. Same class as the LoweredCodeUtils bound in test/Project.toml.
CUDA_Compiler_jll = "=0.5.1"
CUDA = "6.2"
