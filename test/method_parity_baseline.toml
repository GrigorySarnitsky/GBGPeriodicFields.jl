# Method-parity baseline, read by GBGCodingTools.TestHarness.method_parity from test/method_parity.jl.
# The package DECLARES method parity to the tool (RULE.TEST.METHOD_PARITY); these are its frozen numbers.
#
# Two baselines, counting DIFFERENT denominators, which must not be compared:
# - [[generic]]: the enumerated one, the methods a named module defines for each of 28 named generics —
#   FieldAlgebra's M2 + M3 surface (206) and the Points mirror of it (122).
# - [module]: the derived one (decision 53), every method each module owns over the package's whole
#   function surface, internals included, so adding a method anywhere moves a number. A moved number is
#   refrozen deliberately, in the same commit, with the reason written beside it.

